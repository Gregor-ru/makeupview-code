name: makeupview
description: MakeUpView app for virtual makeup try-on
version: 1.0.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  flutter_cube: ^0.1.1
dependency_overrides:
  material_color_utilities: ^0.12.0
  meta: ^1.17.0
  vector_math: ^2.2.0
flutter:
  uses-material-design: false
  assets:
    - assets/models/face.obj
    - assets/models/face_red_lipstick.obj
    - assets/icons/
    - assets/cards/

